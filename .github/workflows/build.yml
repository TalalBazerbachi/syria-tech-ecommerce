# Builds the three app images and pushes them to GHCR as
#   ghcr.io/<owner>/syria-tech-ecommerce-<app>:<sha>  and  :latest
# Images are never built on the VPS: deploy.yml only pulls.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: apps/backend
          - app: cms
            context: apps/cms
          - app: storefront
            context: apps/storefront
    steps:
      - uses: actions/checkout@v4

      - name: Skip apps that do not exist yet
        id: present
        run: |
          if [ -f "${{ matrix.context }}/Dockerfile" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::${{ matrix.context }}/Dockerfile missing, skipping"; fi

      - uses: docker/setup-buildx-action@v3
        if: steps.present.outputs.ok == 'true'

      - uses: docker/login-action@v3
        if: steps.present.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        if: steps.present.outputs.ok == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/syria-tech-ecommerce-${{ matrix.app }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        if: steps.present.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: false
