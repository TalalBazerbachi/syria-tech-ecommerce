# Builds the three app images and pushes them to GHCR as
#   ghcr.io/<owner>/syria-tech-ecommerce-<app>:<sha>  and  :latest
# Images are never built on the VPS: deploy.yml only pulls.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Type errors and failing unit tests stop the release: `next build` itself ignores type
  # errors (next.config.js), so this is the gate. No image is built or deployed when it fails.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Backend - install
        working-directory: apps/backend
        run: npm ci

      - name: Backend - typecheck
        working-directory: apps/backend
        run: npm run typecheck

      - name: Backend - unit tests
        working-directory: apps/backend
        run: npm run test:unit

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/storefront/package.json

      - name: Storefront - install
        working-directory: apps/storefront
        run: pnpm install --frozen-lockfile

      - name: Storefront - typecheck
        working-directory: apps/storefront
        run: pnpm typecheck

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: apps/backend
          - app: cms
            context: apps/cms
          - app: storefront
            context: apps/storefront
    steps:
      - uses: actions/checkout@v4

      - name: Skip apps that do not exist yet
        id: present
        run: |
          if [ -f "${{ matrix.context }}/Dockerfile" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::${{ matrix.context }}/Dockerfile missing, skipping"; fi

      - uses: docker/setup-buildx-action@v3
        if: steps.present.outputs.ok == 'true'

      - uses: docker/login-action@v3
        if: steps.present.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        if: steps.present.outputs.ok == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/syria-tech-ecommerce-${{ matrix.app }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        if: steps.present.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Storefront only: the media host turns on next/image resizing (apps/storefront/next.config.js).
          # Repository variable MEDIA_HOSTNAME, e.g. media.example.com or **.example.com. Empty = off.
          build-args: ${{ matrix.app == 'storefront' && format('NEXT_PUBLIC_MEDIA_HOSTNAME={0}', vars.MEDIA_HOSTNAME) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: false
